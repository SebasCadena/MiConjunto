trigger:
- develop

pool:
  vmImage: ubuntu-latest

stages:
- stage: Build
  displayName: 'Build stage'
  jobs:
  - job: Build
    displayName: 'Build job'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - task: Npm@1
      inputs:
        command: 'install'
        workingDir: 'mi-proyecto'
      displayName: 'npm install'

    - task: Npm@1
      inputs:
        command: 'custom'
        workingDir: 'mi-proyecto'
        customCommand: 'vite build'
      displayName: 'vite build'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'mi-proyecto/dist'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/build$(Build.BuildId).zip'
        replaceExistingArchive: true
      displayName: 'Archive build folder'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'
      displayName: 'Publish artifacts'
- stage: Test
  displayName: 'Test stage'
  dependsOn: Build
  jobs:
  - job: Test
    displayName: 'Test job'
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: '20.x'
        displayName: 'Install Node.js'
      - task: DownloadBuildArtifacts@1
        inputs:
          buildType: 'current'
          downloadType: 'single'
          artifactName: 'drop'
          downloadPath: '$(System.DefaultWorkingDirectory)'
        displayName: 'Download build artifacts'
      - task: Npm@1
        inputs:
          command: 'install'
          workingDir: 'mi-proyecto'
          displayName: 'npm install'
      - task: Npm@1
        inputs:
          command: 'custom'
          workingDir: 'mi-proyecto'
          customCommand: 'eslint .'
        displayName: 'eslint .'

- stage: Deploy
  displayName: 'Deploy stage'
  dependsOn: Test
  condition: succeeded()
  jobs:
  - deployment: Deploy
    displayName: 'Deploy job'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@1
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'drop'
              downloadPath: '$(System.DefaultWorkingDirectory)'
            displayName: 'Download build artifacts'

          - script: echo "Implement deploy steps here"
            displayName: 'Deploy'